name: Rename dynamic wording cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-dynamic-cleanup.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Replace legacy Chinese label
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = '\u670b\u53cb\u5708'
          new = '\u52a8\u6001'
          result = subprocess.run(['git', 'grep', '-Il', old], text=True, capture_output=True)
          paths = [Path(line) for line in result.stdout.splitlines() if line.strip()]
          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              next_text = text.replace(old, new)
              if next_text != text:
                  path.write_text(next_text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed) if changed else 'no legacy wording found')
          PY
      - name: Commit replacements
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add -A
          git commit -m "chore: finish 动态 terminology rename"
          git push origin HEAD:main
