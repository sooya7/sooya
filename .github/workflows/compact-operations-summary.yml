name: Compact operations summary

on:
  push:
    paths:
      - '.github/scripts/compact-operations-summary.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compact operations UI
        run: python .github/scripts/compact-operations-summary.py
      - name: Fix visibility assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/web/src/components/AdminPanel.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "    expect(errors.textContent).not.toContain('invalid_analysis_json');"
          new = "    const summary = errors.querySelector('.admin-error-summary')!;\n    expect(summary.textContent).not.toContain('invalid_analysis_json');\n    expect(errors.querySelector('.admin-error-group')?.hasAttribute('open')).toBe(false);"
          if old not in text:
              raise SystemExit('visibility assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate Web
        run: |
          npm run typecheck -w @sooya/web
          npm run test -w @sooya/web -- src/components/AdminPanel.test.tsx
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/web/src/components/AdminPanel.tsx packages/web/src/components/AdminPanel.css packages/web/src/components/AdminPanel.test.tsx
          git diff --cached --check
          git commit -m "feat(admin): compact operations summaries"
          git push
