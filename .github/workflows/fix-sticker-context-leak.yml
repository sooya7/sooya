name: Fix sticker context leak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sticker-context-leak.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: python scripts/fix-sticker-context-leak.py
      - run: npm run test -w @sooya/server -- sticker-context-output-filter.test.ts
      - run: npm run typecheck -w @sooya/server
      - name: Commit fix
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/server/src/core/directives.ts packages/server/src/core/replier.ts packages/server/src/core/context.ts packages/server/test/sticker-context-output-filter.test.ts
          git commit -m "fix: prevent sticker context metadata leaks"
          git push origin HEAD:main
