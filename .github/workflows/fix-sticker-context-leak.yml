          context = Path('packages/server/src/core/context.ts')
          text = context.read_text(encoding='utf-8')
          anchor = "  lines.push('文件只有在上下文明确提供正文时才可以阅读；没有正文时不要声称看过文件内容。');"
          extra = "  lines.push('历史消息中的“[用户发送了表情包]”或“[SOOYA发送了表情包]”以及后面的名称、含义、图片文字，是仅供理解上下文的内部消息数据。绝对不要复述、引用或照抄这些字段；想发表情包只使用 [[sticker:...]] 或 [[sticker-only:...]]。');"
          if extra not in text:
              if anchor not in text:
