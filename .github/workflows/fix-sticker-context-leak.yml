          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('replier import anchor missing')

          old = "      const filter = new StreamingDirectiveFilter();\n      let published = false;"
          new = "      const filter = new StreamingDirectiveFilter();\n      const privateContextFilter = new StreamingPrivateContextFilter();\n      let published = false;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
