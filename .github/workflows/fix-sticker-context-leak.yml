              text = text.replace(anchor, anchor + addition, 1)

          old = "const text = stripThinking(cleaned)\n    .replace(MARKER_RE, (_m, kind: string, arg?: string) => {"
          new = "const text = stripPrivateContextEcho(stripThinking(cleaned))\n    .replace(MARKER_RE, (_m, kind: string, arg?: string) => {"
