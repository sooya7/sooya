name: Apply proactive worker starvation patch

on:
  push:
    branches:
      - fix/proactive-worker-starvation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/proactive-worker-starvation
          fetch-depth: 0
      - name: Patch life.tick and remove temporary patch workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/server/src/core/jobs.ts')
          text = path.read_text()
          old = """    if (!deps.reachOutEnabled) return;\n    await deps.proactive.run();\n"""
          new = """    if (!deps.reachOutEnabled) return;\n    // Do not let slow proactive composition/media generation occupy the single\n    // durable JobWorker. ReplyCoordinator owns cancellation and user-message\n    // priority, so launch the proactive task outside the durable queue.\n    void deps.proactive.run().catch((error) => {\n      deps.bus.publish('system.notice', {\n        notice: 'proactive reach-out failed',\n        error: (error instanceof Error ? error.message : String(error)).slice(0, 300)\n      });\n    });\n"""
          if old not in text:
              raise SystemExit('expected life.tick proactive await not found')
          path.write_text(text.replace(old, new, 1))
          Path('.ci-hotfix-proactive-disable').unlink(missing_ok=True)
          Path('.github/workflows/patch-proactive-worker-starvation.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(proactive): keep slow reach-outs off durable worker"
          git push origin HEAD:fix/proactive-worker-starvation
