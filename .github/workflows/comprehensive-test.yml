name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sooya-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'

jobs:
  static-validation:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build production bundles
        run: npm run build
      - name: Publish build for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: |
            packages/server/dist
            packages/web/dist
          if-no-files-found: error
          retention-days: 1

  server-tests:
    name: Server tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run server test shard
        run: npm run test -w @sooya/server -- --shard=${{ matrix.shard }}

  # Long-horizon consistency scenarios (plan §25-29): deterministic-clock
  # 30/90-day behaviour checks. Separate job so a slow multi-day simulation
  # never delays the ordinary unit shards.
  long-horizon-tests:
    name: Long-horizon consistency tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run long-horizon scenarios
        run: npx vitest run test/long-horizon
        working-directory: packages/server

  web-tests:
    name: Web unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -w @sooya/web

  e2e:
    name: Browser end-to-end tests
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Reuse validated production build
        uses: actions/download-artifact@v4
        with:
          name: app-build-${{ github.sha }}
          path: packages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  release-and-container:
    name: Release and container smoke
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate release packages
        run: npm run package
      - name: Verify release packages
        run: npm run verify:release
      - name: Validate Ombre deployment manifest
        env:
          OMBRE_RUNTIME_ENV: .env.example
        run: docker compose -f deploy/ombre/docker-compose.yml --env-file deploy/ombre/.env.example config --quiet
      - name: Build Docker image
        run: docker build -t sooya:ci .
      - name: Start container and exercise real entry points
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name sooya-ci -p 8788:8788 \
            -e ADMIN_API_TOKEN=ci-admin-token \
            -e MEMORY_BACKEND=legacy \
            -e MCP_CONNECT_ON_START=false \
            -e BACKUP_INTERVAL_MS=0 \
            sooya:ci
          cleanup() {
            docker logs sooya-ci || true
            docker rm -f sooya-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'SOOYA container did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          # QQ 单通道（§30）：Web 只保留 Admin，聊天走 QQ 官方 Bot 而非 Web Chat API。
          # Readiness alone only proves that the process started. Exercise the real
          # entry points: readiness, Admin 静态页, 鉴权 Admin API 与 QQ 状态摘要。
          curl -fsS http://127.0.0.1:8788/health/ready >/dev/null
          curl -fsS http://127.0.0.1:8788/admin >/dev/null
          curl -fsS -H 'x-admin-token: ci-admin-token' \
            http://127.0.0.1:8788/api/admin/persona >/dev/null
          # QQ 未配置时应返回配置状态摘要（disabled），不联网、不失败。
          curl -fsS -H 'x-admin-token: ci-admin-token' \
            http://127.0.0.1:8788/api/admin/qq/status >/dev/null

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm audit --audit-level=high
