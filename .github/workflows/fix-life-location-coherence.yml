name: Fix Life location coherence

on:
  push:
    paths:
      - '.github/scripts/fix-life-location-coherence.py'
      - '.github/workflows/fix-life-location-coherence.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Apply coherence fix
        run: python .github/scripts/fix-life-location-coherence.py
      - name: Validate focused behavior
        run: |
          npm run typecheck -w @sooya/server
          npm run test -w @sooya/server -- test/life-location-coherence.test.ts test/location.test.ts test/location-travel.test.ts
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/server/src/core/life2/activities.ts \
                  packages/server/src/core/life2/engine.ts \
                  packages/server/src/core/location/selector.ts \
                  packages/server/test/location.test.ts \
                  packages/server/test/life-location-coherence.test.ts
          git diff --cached --check
          git commit -m "fix(life): keep activities coherent with locations"
          git push
