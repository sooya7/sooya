name: Restore directives line endings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-directives-crlf.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python scripts/restore-directives-crlf.py
      - name: Commit line ending restore
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/server/src/core/directives.ts
          git commit -m "chore: restore directives line endings"
          git push origin HEAD:main
