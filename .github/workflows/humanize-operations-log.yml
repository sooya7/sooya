name: Humanize operations log

on:
  push:
    paths:
      - '.github/scripts/humanize-operations-log.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rewrite operations log UI
        run: python .github/scripts/humanize-operations-log.py
      - name: Validate Web
        run: |
          npm run typecheck -w @sooya/web
          npm run test -w @sooya/web -- src/components/AdminPanel.test.tsx
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/web/src/components/AdminPanel.tsx packages/web/src/components/AdminPanel.css
          git diff --cached --check
          git commit -m "feat(admin): make operations logs human-readable"
          git push
