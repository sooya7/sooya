name: Fix dynamic rename edge cases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dynamic-rename.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix exact rename edge cases
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'packages/server/src/core/proactive.ts': [
                  ('为这件真实经历写一条动态动态。', '为这件真实经历写一条生活动态。'),
              ],
              'packages/web/src/components/life/LifeObservationDetails.test.tsx': [
                  ("expect(container!.textContent).not.toContain('动态');", "expect(scroll?.textContent).not.toContain('动态');"),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/server/src/core/proactive.ts packages/web/src/components/life/LifeObservationDetails.test.tsx
          git commit -m "fix: clean up 动态 terminology edge cases"
          git push origin HEAD:main
