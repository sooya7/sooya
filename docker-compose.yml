# SOOYA — single container, single user, no external services.
services:
  sooya:
    build:
      context: .
      dockerfile: Dockerfile
    image: sooya:1.0.0
    container_name: sooya
    restart: unless-stopped
    env_file:
      - .env
    # Docker creates missing bind-mount sources as root:root, which an
    # unprivileged container user cannot write to on a first start. Pin the
    # runtime UID/GID (override in .env with your own `id -u` / `id -g`).
    user: "${SOOYA_UID:-1001}:${SOOYA_GID:-1001}"
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      WEB_DIR: /app/public
    ports:
      # Bind to localhost only; put Nginx in front for public exposure.
      - "127.0.0.1:8788:8788"
    volumes:
      # Everything the user owns. Survives image rebuilds and upgrades.
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Comfortable on a 2 vCPU / 2 GB host.
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
